<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="6; url=https://xsploit.github.io/MapEx2/">
  <title>MapEx has moved</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f2fa; color: #241b31; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 460px); background: white; border-radius: 18px; padding: 36px 28px; box-shadow: 0 12px 38px #241b311a; text-align: center; }
    .brand { color: #4d148c; font-size: 1.15rem; font-weight: 800; letter-spacing: .04em; }
    .brand span { color: #ff6200; }
    h1 { font-size: 1.8rem; line-height: 1.2; margin: 22px 0 12px; }
    p { color: #5b5264; }
    a { display: block; margin: 26px 0 14px; padding: 14px; border-radius: 9px; background: #4d148c; color: white; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #ff6200; outline-offset: 3px; }
    small { color: #6b6272; }
  </style>
</head>
<body>
  <main>
    <div class="brand">MAP<span>EX</span></div>
    <h1>MapEx has moved</h1>
    <p>The updated map is now available at MapEx2.</p>
    <a href="https://xsploit.github.io/MapEx2/">Open MapEx2</a>
    <small>Taking you there automatically in a few seconds.</small>
  </main>
</body>
</html>
