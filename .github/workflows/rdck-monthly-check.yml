name: Check RDCK layer updates

on:
  schedule:
    - cron: '27 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdck-layer-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check layer statistics
        run: python scripts/check-rdck-updates.py
      - name: Save changed indicators
        run: |
          if [ -z "$(git status --porcelain -- data/rdck-layer-status.json)" ]; then
            echo "No change in indicators; no commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/rdck-layer-status.json
          git commit -m 'Update RDCK layer change indicators'
          git push
